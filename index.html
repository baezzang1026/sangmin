<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>建國日報 · 건국일보</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Song+Myung&family=Nanum+Myeongjo:wght@400;700;800&family=Old+Standard+TT:ital,wght@0,400;0,700;1,400&family=UnifrakturMaguntia&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="paper">
    <header class="masthead">
      <div class="ear ear-left">
        <div class="ear-title">오늘의 격언</div>
        <div class="ear-body" id="motto"></div>
        <div class="ear-foot">정가 한 부 오십 환</div>
      </div>
      <div class="title-block">
        <div class="gothic">The Konkuk Daily</div>
        <h1 class="title" aria-label="建國日報"><span style="--i:0">建</span><span style="--i:1">國</span><span style="--i:2">日</span><span style="--i:3">報</span></h1>
        <div class="subtitle">건 국 일 보</div>
      </div>
      <div class="ear ear-right weather" aria-live="polite">
        <div class="ear-title">오늘의 날씨 · <span id="wx-city">서울</span></div>
        <div class="wx-stage">
          <svg class="caster" viewBox="0 0 70 96" aria-hidden="true">
            <!-- 기상캐스터: 판화풍 선화 -->
            <g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
              <path d="M24 19c0-9 6-14 13-14s13 5 13 14c0 4-1 7-2 9" />
              <path d="M24 19c-1 4 0 8 2 10" />
              <circle cx="37" cy="21" r="10" fill="var(--paper)" />
              <path d="M27 17c4-5 13-6 20-1" />
              <circle cx="33.5" cy="21" r=".9" fill="currentColor" />
              <circle cx="40.5" cy="21" r=".9" fill="currentColor" />
              <path d="M34 26c2 1.6 4 1.6 6 0" />
              <path d="M34 31v3h6v-3" />
              <path d="M20 94l3-44c1-9 6-14 14-15 8 1 13 6 14 15l3 44" fill="var(--paper)" />
              <path d="M37 35l-4 10 4 4 4-4-4-10" />
              <path d="M37 49v45" stroke-dasharray="1 3" />
              <path d="M23 54l-2 26" />
              <g class="caster-arm">
                <path d="M50 46l9-12" />
                <path d="M59 34l9-14" stroke-width="1.1" />
                <circle cx="59" cy="34" r="2.2" fill="var(--paper)" />
              </g>
            </g>
          </svg>
          <div class="wx-board">
            <div class="wx-icon" id="wx-icon"></div>
            <div class="wx-temp" id="wx-temp">--°</div>
          </div>
        </div>
        <div class="wx-say" id="wx-say">날씨를 불러오는 중…</div>
      </div>
    </header>

    <div class="dateline">
      <span id="issue">제 　호</span>
      <span id="date"></span>
      <span id="updated"></span>
    </div>

    <div id="notice" class="notice" hidden></div>

    <section id="lead" class="lead"></section>

    <h2 class="section-head"><span>국내소식</span><small>국내 주요 소식</small></h2>
    <section id="domestic" class="pager"></section>

    <h2 class="section-head"><span>해외소식</span><small>해외 언론이 전하는 세계</small></h2>
    <section id="intl-lead" class="lead intl-lead"></section>
    <section id="international" class="pager intl"></section>

    <footer class="colophon">
      <div class="ornament">❦ ❦ ❦</div>
      <p>본지는 매일 오전 8시에 새로 발행됩니다. 기사 제목을 누르면 원문으로 이동합니다.</p>
      <p class="sources" id="sources"></p>
    </footer>
  </main>

  <script>
    // 매일 새 호가 바로 보이도록 기사 파일은 캐시 없이 불러온다
    (function () {
      var load = function (src, next) {
        var s = document.createElement("script");
        s.src = src; s.onload = next; s.onerror = next;
        document.body.appendChild(s);
      };
      load("data/news.js?t=" + Date.now(), function () {
        load("app.js?t=" + Date.now(), function () { load("weather.js?t=" + Date.now()); });
      });
    })();
  </script>
</body>
</html>
