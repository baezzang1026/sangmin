name: 아침신보 발행

on:
  schedule:
    - cron: "0 23 * * *"   # 매일 23:00 UTC = 한국시간 오전 8시
  workflow_dispatch:        # Actions 탭에서 수동 발행

permissions:
  contents: write

concurrency:
  group: morning-edition
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 뉴스 수집
        env:
          TZ: Asia/Seoul
        run: python fetch_news.py

      - name: 새 호 커밋
        run: |
          git config user.name "morning-edition-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news.js data/news.json
          git diff --cached --quiet || git commit -m "아침신보 $(TZ=Asia/Seoul date +%Y-%m-%d) 발행"
          git push
